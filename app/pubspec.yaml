name: hivehub
description: One dashboard for all your deployments, sites, and hosting providers — Hivetics by TheHiveMinds
publish_to: "none"
version: 0.1.1+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.0

  # Secure credential storage (Android Keystore)
  flutter_secure_storage: ^9.2.0

  # SQLite cache (drift)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0

  # Non-secret prefs (theme, quota counters)
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^6.2.0
  lucide_icons_flutter: ^3.1.20
  flutter_svg: ^2.0.0
  url_launcher: ^6.2.0

  # Utilities
  intl: ^0.19.0

  # Code-gen annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  path: ^1.9.1
  uuid: ^4.6.0

  # NOT in Phase 1 — add when needed:
  # flutter_appauth: ^6.0.0     ← Phase 3 (Google OAuth)
  # in_app_purchase: ^3.2.0     ← Phase 4 (Play Billing)
  # local_auth: ^2.2.0          ← Phase 5 (biometric lock)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.16.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # Testing
  mocktail: ^1.0.4

  # Lints
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo.png
